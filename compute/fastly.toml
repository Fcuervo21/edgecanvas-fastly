# Fastly Compute manifest for EdgeCanvas. The whole product runs in this one service: API,
# accounts and room state in KV Store, secrets in Secret Store, live streams through Fanout
# (with this service as its own Fanout backend). No service_id is committed; M5 deployment
# creates or links the service with an explicitly authorized account.
manifest_version = 3
name = "edgecanvas-edge"
description = "EdgeCanvas: team paint rooms on Fastly Compute, KV Store and Fanout"
language = "javascript"
authors = []

[scripts]
build = "npm run build"

[setup.kv_stores.edgecanvas]
description = "Rooms, accounts and the private roster (write-once versioned records)"

[setup.secret_stores.edgecanvas_secrets]
description = "admin_token, password_pepper and fanout_api_token (never committed)"

[setup.backends.fanout_publish]
address = "api.fastly.com"
port = 443

[local_server]
  # Fanout forwards held-stream requests back to this service ("self").
  [local_server.backends.self]
  url = "http://127.0.0.1:7676"

  # Local Pushpin publish endpoint (see scripts/local-pushpin.sh).
  [local_server.backends.pushpin_publish]
  url = "http://127.0.0.1:5561"

  [local_server.backends.fanout_publish]
  url = "https://api.fastly.com"

  [local_server.kv_stores]
  edgecanvas = []

  # Generated by scripts/local-secrets.mjs into .secrets/ (git-ignored).
  [[local_server.secret_stores.edgecanvas_secrets]]
  key = "admin_token"
  file = ".secrets/admin_token"

  [[local_server.secret_stores.edgecanvas_secrets]]
  key = "password_pepper"
  file = ".secrets/password_pepper"

  [[local_server.secret_stores.edgecanvas_secrets]]
  key = "local_grip_key"
  file = ".secrets/local_grip_key"
